services:
  confluence:
    build: ./confluence
    container_name: confluence-service
    ports:
      - "8001:8001"
    environment:
      - GATESTACK_API_URL=http://host.docker.internal:8000
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${GATEWIKI_DB_USER:?Set GATEWIKI_DB_USER in .env}
      - DB_PASSWORD=${GATEWIKI_DB_PASSWORD:?Set GATEWIKI_DB_PASSWORD in .env}
      - DB_NAME=${DB_NAME:-gatestack}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
      - GATESTORAGE_API_URL=http://host.docker.internal:8002
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-gatewiki-assistant}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-45}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  confluence-frontend:
    image: node:22-alpine
    container_name: confluence-frontend
    working_dir: /app
    volumes:
      - ./confluence/frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    environment:
      - VITE_SERVER_HOST=${VITE_SERVER_HOST:-192.168.1.150}
      - VITE_SERVER_PROTOCOL=${VITE_SERVER_PROTOCOL:-http}
      - VITE_GATEWIKI_BACKEND_PORT=${VITE_GATEWIKI_BACKEND_PORT:-8001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  gatestorage:
    build: ./gatestorage
    container_name: gatestorage-service
    ports:
      - "8002:8002"
    volumes:
      - gatestorage_data:/app/data
    environment:
      - GATESTACK_API_URL=http://host.docker.internal:8000
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${GATESTORAGE_DB_USER:?Set GATESTORAGE_DB_USER in .env}
      - DB_PASSWORD=${GATESTORAGE_DB_PASSWORD:?Set GATESTORAGE_DB_PASSWORD in .env}
      - DB_NAME=${DB_NAME:-gatestack}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  gatestorage-frontend:
    image: node:22-alpine
    container_name: gatestorage-frontend
    working_dir: /app
    volumes:
      - ./gatestorage/frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5175"
    ports:
      - "5175:5175"
    environment:
      - VITE_SERVER_HOST=${VITE_SERVER_HOST:-192.168.1.150}
      - VITE_SERVER_PROTOCOL=${VITE_SERVER_PROTOCOL:-http}
      - VITE_GATESTORAGE_BACKEND_PORT=${VITE_GATESTORAGE_BACKEND_PORT:-8002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  video-watcher:
    build: ./video-watcher/backend
    container_name: video-watcher-service
    ports:
      - "8003:8003"
    volumes:
      - video_watcher_data:/app/data
    environment:
      - GATESTACK_API_URL=http://host.docker.internal:8000
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${VIDEOWATCHER_DB_USER:?Set VIDEOWATCHER_DB_USER in .env}
      - DB_PASSWORD=${VIDEOWATCHER_DB_PASSWORD:?Set VIDEOWATCHER_DB_PASSWORD in .env}
      - DB_NAME=${DB_NAME:-gatestack}
      - VIDEO_WATCHER_DATA_ROOT=/app/data
      - FFMPEG_PATH=ffmpeg
      - LLM_PROVIDER=${VIDEO_WATCHER_LLM_PROVIDER:-mock}
      - LLM_MODEL=${VIDEO_WATCHER_LLM_MODEL:-mock-vision-verifier}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  video-watcher-frontend:
    image: node:22-alpine
    container_name: video-watcher-frontend
    working_dir: /app
    volumes:
      - ./video-watcher/frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5176"
    ports:
      - "5176:5176"
    environment:
      - VITE_SERVER_HOST=${VITE_SERVER_HOST:-192.168.1.150}
      - VITE_SERVER_PROTOCOL=${VITE_SERVER_PROTOCOL:-http}
      - VITE_VIDEO_WATCHER_BACKEND_PORT=${VITE_VIDEO_WATCHER_BACKEND_PORT:-8003}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  gatechat:
    build: ./gatechat/backend
    container_name: gatechat-service
    ports:
      - "8013:8013"
    environment:
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${GATECHAT_DB_USER:?Set GATECHAT_DB_USER in .env}
      - DB_PASSWORD=${GATECHAT_DB_PASSWORD:?Set GATECHAT_DB_PASSWORD in .env}
      - DB_NAME=${DB_NAME:-gatestack}
      - GATECHAT_OLLAMA_BASE_URL=${GATECHAT_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - GATECHAT_DEFAULT_MODEL=${GATECHAT_DEFAULT_MODEL:-qwen2.5:7b-instruct}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  gatechat-frontend:
    image: node:22-alpine
    container_name: gatechat-frontend
    working_dir: /app
    volumes:
      - ./gatechat/frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5186"
    ports:
      - "5186:5186"
    environment:
      - VITE_SERVER_HOST=${VITE_SERVER_HOST:-192.168.1.150}
      - VITE_SERVER_PROTOCOL=${VITE_SERVER_PROTOCOL:-http}
      - VITE_GATECHAT_BACKEND_PORT=${VITE_GATECHAT_BACKEND_PORT:-8013}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

volumes:
  gatestorage_data:
  video_watcher_data:
