services:
  mysql:
    image: mysql:8.4
    container_name: gatestack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gatestack
      MYSQL_USER: gatestack
      MYSQL_PASSWORD: gatestack
    ports:
      - "3306:3306"
    volumes:
      - gatestack_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  gatestack_mysql:
