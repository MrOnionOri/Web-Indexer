services:
  mysql:
    image: mysql:8.4
    container_name: gatestack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gatestack
      MYSQL_USER: gatestack
      MYSQL_PASSWORD: gatestack
    ports:
      - "3306:3306"
    volumes:
      - gatestack_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  confluence:
    build: ./confluence
    container_name: confluence-service
    ports:
      - "8001:8001"
    environment:
      - GATESTACK_API_URL=http://host.docker.internal:8000
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=Lmao123@@123//
      - DB_NAME=gatestack
      - GATESTORAGE_API_URL=http://host.docker.internal:8002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  gatestorage:
    build: ./gatestorage
    container_name: gatestorage-service
    ports:
      - "8002:8002"
    environment:
      - GATESTACK_API_URL=http://host.docker.internal:8000
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=Lmao123@@123//
      - DB_NAME=gatestack
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  gatestorage-frontend:
    image: node:22-alpine
    container_name: gatestorage-frontend
    working_dir: /app
    volumes:
      - ./gatestorage/frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5174:5174"
    environment:
      - VITE_GATESTORAGE_BACKEND_URL=http://host.docker.internal:8002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

volumes:
  gatestack_mysql:
