services:
  mysql:
    image: mysql:8.4
    container_name: gatestack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gatestack
      MYSQL_USER: gatestack
      MYSQL_PASSWORD: gatestack
    ports:
      - "3306:3306"
    volumes:
      - gatestack_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  confluence:
    build: ./confluence
    container_name: confluence-service
    ports:
      - "8001:8001"
    environment:
      - GATESTACK_API_URL=http://host.docker.internal:8000
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=Lmao123@@123//
      - DB_NAME=gatestack
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

volumes:
  gatestack_mysql:
